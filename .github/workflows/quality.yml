name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives

# Phase 1 intentionally keeps CI to the minimal useful combinations:
# - GCC + Debug + tests
# - Clang + Debug + tests
# - Clang + ASan/UBSan
# - Clang + TSan
# Coverage and benchmark jobs remain separate when they produce meaningful evidence.

jobs:
  quality:
    name: quality (${{ matrix.compiler }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-vcpkg-${{ matrix.compiler }}-debug-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ matrix.compiler }}-debug-

      - name: Prepare vcpkg binary cache
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            gcc \
            g++ \
            clang

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python protobuf runtime
        run: python -m pip install --requirement simulator-python/requirements.txt

      - name: Bootstrap pinned vcpkg
        run: ./scripts/bootstrap-vcpkg.sh

      - name: Record compiler versions
        run: |
          g++ --version
          clang++ --version

      - name: Record runner and toolchain evidence
        run: |
          echo "Runner image: $RUNNER_OS"
          cat /etc/os-release
          cmake --version
          ninja --version
          g++ --version
          clang++ --version
          "$VCPKG_ROOT/vcpkg" version
          git -C "$VCPKG_ROOT" rev-parse HEAD
          grep -n '"builtin-baseline"' vcpkg.json

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake --preset debug \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DTELEMETRY_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: |
          ctest --preset debug \
            --output-on-failure \
            --output-junit build/debug/ctest-junit.xml

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ matrix.compiler }}
          if-no-files-found: warn
          path: |
            build/debug/ctest-junit.xml
            build/debug/Testing/Temporary/LastTest.log
            build/debug/compile_commands.json

  asan-ubsan:
    name: asan-ubsan
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-vcpkg-clang-asan-ubsan-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-clang-asan-ubsan-

      - name: Prepare vcpkg binary cache
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python protobuf runtime
        run: python -m pip install --requirement simulator-python/requirements.txt

      - name: Bootstrap pinned vcpkg
        run: ./scripts/bootstrap-vcpkg.sh

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset asan-ubsan \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build
        run: cmake --build --preset asan-ubsan

      - name: Test
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          ctest --preset asan-ubsan \
            --output-junit build/asan-ubsan/ctest-junit.xml \
            2>&1 | tee asan-ubsan.log

      - name: Upload ASan/UBSan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-ubsan-evidence
          if-no-files-found: warn
          path: |
            asan-ubsan.log
            build/asan-ubsan/Testing/Temporary/LastTest.log
            build/asan-ubsan/ctest-junit.xml
            build/asan-ubsan/compile_commands.json

      - name: Record compiler version
        if: always()
        run: clang++ --version

  tsan:
    name: tsan
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-vcpkg-clang-tsan-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-clang-tsan-

      - name: Prepare vcpkg binary cache
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python protobuf runtime
        run: python -m pip install --requirement simulator-python/requirements.txt

      - name: Bootstrap pinned vcpkg
        run: ./scripts/bootstrap-vcpkg.sh

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset tsan \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build
        run: cmake --build --preset tsan

      - name: Test
        run: |
          ctest --preset tsan \
            --output-junit build/tsan/ctest-junit.xml \
            2>&1 | tee tsan.log

      - name: Upload TSan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-evidence
          if-no-files-found: warn
          path: |
            tsan.log
            build/tsan/Testing/Temporary/LastTest.log
            build/tsan/ctest-junit.xml
            build/tsan/compile_commands.json

      - name: Record compiler version
        if: always()
        run: clang++ --version