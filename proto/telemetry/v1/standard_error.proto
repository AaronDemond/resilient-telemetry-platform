syntax = "proto3";

package telemetry.v1;

option java_package = "com.telemetry.v1";
option go_package = "telemetry/v1;telemetryv1";

message StandardError {
  ErrorCode code = 1;
  string message = 2;
  string source_field = 3;
  map<string, string> metadata = 4;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_VALIDATION_FAILED = 1;
  ERROR_CODE_SCHEMA_MISMATCH = 2;
  ERROR_CODE_UNIT_NOT_FOUND = 3;
  ERROR_CODE_BOOT_MISMATCH = 4;
  ERROR_CODE_SEQUENCE_OUT_OF_ORDER = 5;
  ERROR_CODE_DUPLICATE_EVENT = 6;
  ERROR_CODE_PAYLOAD_TOO_LARGE = 7;
  ERROR_CODE_RATE_LIMITED = 8;
  ERROR_CODE_INTERNAL_ERROR = 9;
}
