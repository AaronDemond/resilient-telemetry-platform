<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telemetry Units</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --accent: #38bdf8;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --available: #8b5cf6;
        --en-route: #22c55e;
        --returning: #facc15;
        --err: #f87171;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: linear-gradient(180deg, var(--bg), #020617);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      .container {
        max-width: 1100px;
        margin: 32px auto;
        padding: 20px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .toolbar h1 {
        margin: 0;
        font-size: 2rem;
      }

      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: end;
      }

      .toolbar .field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .toolbar .field-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .control-panel {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: end;
        margin: 16px 0 20px;
        padding: 14px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .control-panel input {
        min-width: 140px;
      }

      input, button {
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        padding: 10px 12px;
        font-size: 14px;
      }

      input {
        background: var(--panel);
        color: var(--text);
        min-width: 220px;
      }

      button {
        background: var(--accent);
        color: #082f49;
        font-weight: 700;
        cursor: pointer;
      }

      .status {
        background: var(--panel);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 16px;
        color: var(--muted);
      }

      .map-panel {
        background: var(--panel);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 18px;
      }

      .panel-header {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .panel-header h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .panel-note {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .map-shell {
        position: relative;
        height: 520px;
        overflow: hidden;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background:
          linear-gradient(180deg, rgba(15, 23, 42, 0.94), rgba(3, 7, 18, 0.98)),
          repeating-linear-gradient(0deg, rgba(148, 163, 184, 0.11) 0, rgba(148, 163, 184, 0.11) 1px, transparent 1px, transparent 10%),
          repeating-linear-gradient(90deg, rgba(148, 163, 184, 0.11) 0, rgba(148, 163, 184, 0.11) 1px, transparent 1px, transparent 10%);
      }

      .map-shell::before {
        content: '0,0';
        position: absolute;
        left: 10px;
        bottom: 10px;
        color: var(--muted);
        font-size: 11px;
        z-index: 1;
      }

      .map-shell::after {
        content: '120,120';
        position: absolute;
        right: 10px;
        top: 10px;
        color: var(--muted);
        font-size: 11px;
        z-index: 1;
      }

      .map-empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 14px;
        z-index: 0;
      }

      .map-units {
        position: absolute;
        inset: 0;
        z-index: 2;
      }

      .unit-marker {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        z-index: 3;
      }

      .unit-square {
        position: relative;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        border: 2px solid rgba(15, 23, 42, 0.9);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.06);
      }

      .unit-id-label {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.28);
        color: var(--text);
        font-size: 10px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .unit-square.ok {
        background: var(--available);
      }

      .unit-square.warn {
        background: var(--en-route);
      }

      .unit-square.returning {
        background: var(--returning);
      }

      .unit-square.err {
        background: var(--err);
      }

      .unit-square.has-flags {
        box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.65);
      }

      .unit-tooltip {
        position: absolute;
        left: 50%;
        top: calc(100% + 6px);
        transform: translateX(-50%);
        padding: 3px 6px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.25);
        color: var(--text);
        font-size: 10px;
        white-space: nowrap;
        pointer-events: none;
      }

      .map-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .legend-swatch {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        display: inline-block;
      }

      .legend-swatch.available { background: var(--available); }
      .legend-swatch.en-route { background: var(--en-route); }
      .legend-swatch.returning { background: var(--returning); }
      .legend-swatch.flags { background: rgba(248, 113, 113, 0.75); }

      .table-wrap {
        overflow-x: auto;
        background: var(--panel);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
        font-size: 13px;
      }

      th {
        background: var(--panel-alt);
        color: var(--muted);
      }

      tr:hover {
        background: rgba(56, 189, 248, 0.05);
      }

      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
      }

      .sub-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }

      .mini-badge {
        display: inline-block;
        padding: 3px 6px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.12);
        color: var(--text);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .ok { background: rgba(139, 92, 246, 0.15); color: var(--available); }
      .warn { background: rgba(34, 197, 94, 0.15); color: var(--en-route); }
      .returning { background: rgba(250, 204, 21, 0.18); color: var(--returning); }
      .err { background: rgba(248, 113, 113, 0.14); color: var(--err); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="toolbar">
        <h1>Telemetry Units</h1>
        <div class="controls">
          <div class="field-group">
            <label class="field-label" for="runId">Run ID</label>
            <input id="runId" type="text" placeholder="Run id (required)" />
          </div>
          <div class="field-group">
            <label class="field-label" for="unitId">Unit ID filter</label>
            <input id="unitId" type="text" placeholder="Filter by unit id (optional)" />
          </div>
          <button id="loadBtn">Load telemetry</button>
        </div>
      </div>

      <div class="control-panel">
        <div class="field-group">
          <label class="field-label" for="seedInput">Seed</label>
          <input id="seedInput" type="number" min="0" max="4294967295" placeholder="Seed" />
        </div>
        <div class="field-group">
          <label class="field-label" for="unitCountInput">Units</label>
          <input id="unitCountInput" type="number" min="1" max="500" placeholder="Units" />
        </div>
        <div class="field-group">
          <label class="field-label" for="intervalMsInput">Interval (ms)</label>
          <input id="intervalMsInput" type="number" min="250" max="3600000" placeholder="Interval ms" />
        </div>
        <div class="field-group">
          <label class="field-label" for="iterationCountInput">Iterations</label>
          <input id="iterationCountInput" type="number" min="1" max="100000" placeholder="Iterations" />
        </div>
        <button id="startRunBtn">Start run</button>
        <button id="pauseRunBtn">Pause</button>
        <button id="stopRunBtn">Stop</button>
        <button id="continueRunBtn">Continue</button>
        <div class="field-group">
          <label class="field-label" for="compareLeftRunId">Compare left run</label>
          <input id="compareLeftRunId" type="text" placeholder="Compare left run" />
        </div>
        <div class="field-group">
          <label class="field-label" for="compareRightRunId">Compare right run</label>
          <input id="compareRightRunId" type="text" placeholder="Compare right run" />
        </div>
        <button id="compareRunsBtn">Compare runs</button>
      </div>

      <div id="status" class="status">Ready.</div>

      <section class="map-panel">
        <div class="panel-header">
          <h2>Unit Map</h2>
          <div class="panel-note">120x120 view derived from latitude and longitude</div>
        </div>
        <div class="map-shell" id="mapShell">
          <div class="map-empty" id="mapEmpty">Loading map data...</div>
          <div class="map-units" id="mapUnits"></div>
        </div>
        <div class="map-legend" aria-label="Map legend">
          <div class="legend-item"><span class="legend-swatch available"></span>UNIT_STATUS_AVAILABLE</div>
          <div class="legend-item"><span class="legend-swatch en-route"></span>UNIT_STATUS_EN_ROUTE</div>
          <div class="legend-item"><span class="legend-swatch returning"></span>UNIT_STATUS_RETURNING</div>
          <div class="legend-item"><span class="legend-swatch flags"></span>Health flag active</div>
        </div>
      </section>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Unit</th>
              <th>Run</th>
              <th>Received</th>
              <th>Status</th>
              <th>Health</th>
              <th>Latitude</th>
              <th>Longitude</th>
              <th>Fuel</th>
              <th>Temp C</th>
              <th>Connectivity</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <script>
      const rowsEl = document.getElementById('rows');
      const statusEl = document.getElementById('status');
      const runIdEl = document.getElementById('runId');
      const unitIdEl = document.getElementById('unitId');
      const loadBtn = document.getElementById('loadBtn');
      const mapUnitsEl = document.getElementById('mapUnits');
      const mapEmptyEl = document.getElementById('mapEmpty');

      let refreshTimer = null;
      let selectedRunId = null;
      let selectedUnitId = null;
      const controlApiBase = (
        window.location.origin && window.location.origin !== 'null'
          ? window.location.origin
          : 'http://127.0.0.1:8765'
      );

      function stopPolling() {
        if (refreshTimer !== null) {
          window.clearInterval(refreshTimer);
          refreshTimer = null;
        }
      }

      function startPolling() {
        if (refreshTimer !== null || !selectedRunId) {
          return;
        }
        refreshTimer = window.setInterval(() => {
          if (selectedRunId) {
            fetchUnits();
          }
        }, 5000);
      }

      async function callControlApi(path, method = 'GET', body = null) {
        const options = { method, headers: { 'Content-Type': 'application/json' } };
        if (body !== null) {
          options.body = JSON.stringify(body);
        }
        const response = await fetch(`${controlApiBase}${path}`, options);
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }
        return payload;
      }

      async function startRun() {
        try {
          const payload = {
            seed: Number(document.getElementById('seedInput').value),
            unit_count: Number(document.getElementById('unitCountInput').value),
            interval_ms: Number(document.getElementById('intervalMsInput').value),
            iteration_count: Number(document.getElementById('iterationCountInput').value),
          };

          const result = await callControlApi('/api/v1/simulations', 'POST', payload);
          const nextRunId = result.run_id || result[0]?.run_id || '';
          runIdEl.value = nextRunId;
          selectedRunId = nextRunId;
          selectedUnitId = null;
          unitIdEl.value = '';
          statusEl.textContent = `Started run ${selectedRunId}.`;
          startPolling();
          await fetchUnits();
        } catch (error) {
          statusEl.textContent = `Start run failed: ${error.message}`;
          statusEl.className = 'status err';
        }
      }

      async function currentRunId() {
        const explicitId = (runIdEl.value.trim() || selectedRunId || '').trim();
        if (explicitId) {
          runIdEl.value = explicitId;
          selectedRunId = explicitId;
          return explicitId;
        }

        try {
          const current = await callControlApi('/api/v1/simulations/current', 'GET');
          if (current && current.run_id) {
            runIdEl.value = current.run_id;
            selectedRunId = current.run_id;
            return current.run_id;
          }
        } catch (error) {
          return '';
        }

        return '';
      }

      async function pauseRun() {
        let runId = await currentRunId();
        if (!runId) {
          statusEl.textContent = 'No active run to pause.';
          return;
        }
        try {
          const result = await callControlApi('/api/v1/simulations/pause', 'POST');
          runIdEl.value = runId;
          selectedRunId = runId;
          statusEl.textContent = `Paused run ${runId}: ${result.state || 'paused'}`;
        } catch (error) {
          statusEl.textContent = `Pause failed: ${error.message}`;
          statusEl.className = 'status err';
        }
      }

      async function stopRun() {
        let runId = await currentRunId();
        if (!runId) {
          statusEl.textContent = 'No active run to stop.';
          return;
        }
        try {
          const result = await callControlApi('/api/v1/simulations/stop', 'POST');
          runIdEl.value = runId;
          selectedRunId = runId;
          statusEl.textContent = `Stopped run ${runId}: ${result.state || 'stopped'}`;
        } catch (error) {
          statusEl.textContent = `Stop failed: ${error.message}`;
          statusEl.className = 'status err';
        }
      }

      async function continueRun() {
        const runId = runIdEl.value.trim();
        if (!runId) {
          statusEl.textContent = 'Enter a run ID before continuing.';
          return;
        }
        try {
          const result = await callControlApi(`/api/v1/simulations/${encodeURIComponent(runId)}/continue`, 'POST');
          selectedRunId = runId;
          selectedUnitId = null;
          unitIdEl.value = '';
          runIdEl.value = runId;
          startPolling();
          statusEl.textContent = `Continued run ${runId}: ${result.state || 'running'}`;
          await fetchUnits();
        } catch (error) {
          statusEl.textContent = `Continue failed: ${error.message}`;
          statusEl.className = 'status err';
        }
      }

      async function compareRuns() {
        const leftRunId = document.getElementById('compareLeftRunId').value.trim();
        const rightRunId = document.getElementById('compareRightRunId').value.trim();
        if (!leftRunId || !rightRunId) {
          statusEl.textContent = 'Add both run IDs before comparison.';
          return;
        }
        try {
          const result = await callControlApi('/api/v1/simulations/compare', 'POST', { left_run_id: leftRunId, right_run_id: rightRunId });
          statusEl.textContent = `Comparison result: ${result.reason || 'unknown'}`;
        } catch (error) {
          statusEl.textContent = `Comparison failed: ${error.message}`;
          statusEl.className = 'status err';
        }
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function statusInfoFromValue(statusValue) {
        switch (statusValue) {
          case 1:
            return { text: 'UNIT_STATUS_AVAILABLE', className: 'ok' };
          case 2:
            return { text: 'UNIT_STATUS_EN_ROUTE', className: 'warn' };
          case 3:
            return { text: 'UNIT_STATUS_RETURNING', className: 'returning' };
          default:
            return { text: 'UNKNOWN', className: 'err' };
        }
      }

      function hasHealthFlags(row) {
        return Boolean(row.temperature_warning || row.connectivity_degraded || row.maintenance_required);
      }

      function healthFlagList(row) {
        const flags = [];
        if (row.temperature_warning) flags.push('temperature_warning');
        if (row.connectivity_degraded) flags.push('connectivity_degraded');
        if (row.maintenance_required) flags.push('maintenance_required');
        return flags;
      }

      function latitudeToMapY(latitude) {
        const numericLatitude = Number(latitude ?? 0);
        const mapSize = 120;
        const padding = 6;
        // Convert geographic coordinates to 120 map units, then to CSS percent.
        const mapY = mapSize - (((numericLatitude + 90) / 180) * mapSize);
        return (clamp(mapY, padding, mapSize - padding) / mapSize) * 100;
      }

      function longitudeToMapX(longitude) {
        const numericLongitude = Number(longitude ?? 0);
        const mapSize = 120;
        const padding = 6;
        // Convert geographic coordinates to 120 map units, then to CSS percent.
        const mapX = ((numericLongitude + 180) / 360) * mapSize;
        return (clamp(mapX, padding, mapSize - padding) / mapSize) * 100;
      }

      function latestUnits(rows) {
        const seen = new Map();

        for (const row of rows) {
          if (!row.unit_id || seen.has(row.unit_id)) {
            continue;
          }

          seen.set(row.unit_id, row);
        }

        return Array.from(seen.values());
      }

      function renderMap(rows) {
        if (!Array.isArray(rows)) {
          mapUnitsEl.innerHTML = '';
          mapEmptyEl.textContent = 'No telemetry yet.';
          mapEmptyEl.style.display = 'flex';
          return;
        }

        const units = latestUnits(rows);
        mapUnitsEl.innerHTML = '';

        if (units.length === 0) {
          mapEmptyEl.textContent = 'No telemetry yet.';
          mapEmptyEl.style.display = 'flex';
          return;
        }

        mapEmptyEl.style.display = 'none';

        for (const row of units) {
          const statusInfo = statusInfoFromValue(Number(row.status ?? 0));
          const marker = document.createElement('div');
          const square = document.createElement('div');
          const label = document.createElement('div');
          const unitFlags = healthFlagList(row);

          marker.className = 'unit-marker';
          marker.style.left = `${longitudeToMapX(row.longitude)}%`;
          marker.style.top = `${latitudeToMapY(row.latitude)}%`;
          marker.style.cursor = 'pointer';
          marker.title = `${row.unit_id ?? 'unknown'} | ${statusInfo.text}${unitFlags.length > 0 ? ` | ${unitFlags.join(', ')}` : ''}`;

          square.className = `unit-square ${statusInfo.className}${unitFlags.length > 0 ? ' has-flags' : ''}`;

          label.className = 'unit-id-label';
          label.textContent = row.unit_id ?? 'unknown';

          marker.addEventListener('click', () => {
            const unitId = row.unit_id ?? '';
            if (!unitId) {
              return;
            }
            unitIdEl.value = unitId;
            selectedUnitId = unitId;
            fetchUnits(unitId);
          });

          marker.appendChild(square);
          marker.appendChild(label);
          mapUnitsEl.appendChild(marker);
        }
      }

      async function fetchUnits(unitIdOverride = null) {
        const currentId = await currentRunId();
        const runId = (runIdEl.value.trim() || currentId || selectedRunId || '').trim();
        if (runId) {
          runIdEl.value = runId;
          selectedRunId = runId;
        }
        const id = (unitIdOverride ?? unitIdEl.value.trim());

        if (!runId) {
          selectedRunId = null;
          selectedUnitId = null;
          unitIdEl.value = '';
          rowsEl.innerHTML = '';
          mapUnitsEl.innerHTML = '';
          mapEmptyEl.textContent = 'Select a run ID to load telemetry.';
          mapEmptyEl.style.display = 'flex';
          stopPolling();
          statusEl.textContent = 'Select a run ID to load telemetry.';
          statusEl.className = 'status';
          return;
        }

        if (selectedRunId !== runId) {
          selectedRunId = runId;
          selectedUnitId = null;
          unitIdEl.value = '';
        } else {
          selectedUnitId = id || null;
          if (selectedUnitId === null) {
            unitIdEl.value = '';
          } else {
            unitIdEl.value = selectedUnitId;
          }
        }

        const listUrl = `http://127.0.0.1:8080/api/v1/units?run_id=${encodeURIComponent(selectedRunId)}`;
        const unitUrl = selectedUnitId ? `${listUrl}&id=${encodeURIComponent(selectedUnitId)}` : listUrl;

        statusEl.textContent = 'Loading telemetry...';
        statusEl.className = 'status';

        try {
          const response = await fetch(unitUrl, {
            method: 'GET',
            headers: {'Content-Type': 'application/json'}
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`HTTP ${response.status}: ${errorText}`);
          }

          const data = await response.json();
          const orderedRows = Array.isArray(data)
            ? [...data].sort((a, b) => new Date(b.received_at ?? 0) - new Date(a.received_at ?? 0))
            : [];

          const mapRowsResponse = await fetch(listUrl, {
            method: 'GET',
            headers: {'Content-Type': 'application/json'}
          });
          if (!mapRowsResponse.ok) {
            throw new Error(`HTTP ${mapRowsResponse.status}: ${await mapRowsResponse.text()}`);
          }

          const mapRows = await mapRowsResponse.json();
          const compactMapRows = Array.isArray(mapRows)
            ? [...mapRows].sort((a, b) => new Date(b.received_at ?? 0) - new Date(a.received_at ?? 0))
            : [];

          renderMap(compactMapRows);
          renderRows(orderedRows);
          statusEl.textContent = `Loaded ${orderedRows.length} telemetry rows for run ${selectedRunId}${selectedUnitId ? ` and unit ${selectedUnitId}` : ''}.`;
          statusEl.className = 'status';
        } catch (error) {
          statusEl.textContent = `Error: ${error.message}`;
          statusEl.className = 'status err';
          rowsEl.innerHTML = '';
          mapUnitsEl.innerHTML = '';
          mapEmptyEl.textContent = 'Map unavailable.';
          mapEmptyEl.style.display = 'flex';
        }
      }

      function renderRows(rows) {
        rowsEl.innerHTML = '';

        if (!Array.isArray(rows) || rows.length === 0) {
          rowsEl.innerHTML = '<tr><td colspan="10">No telemetry records found.</td></tr>';
          return;
        }

        const orderedRows = [...rows].sort((a, b) => new Date(b.received_at ?? 0) - new Date(a.received_at ?? 0));

        for (const row of orderedRows) {
          const tr = document.createElement('tr');

          const statusInfo = statusInfoFromValue(Number(row.status ?? 0));
          const healthFlags = [];
          if (row.temperature_warning) healthFlags.push('temperature_warning');
          if (row.connectivity_degraded) healthFlags.push('connectivity_degraded');
          if (row.maintenance_required) healthFlags.push('maintenance_required');

          const healthMarkup = healthFlags.length > 0
            ? `<div class="sub-badges">${healthFlags.map((flag) => `<span class="mini-badge">${flag}</span>`).join('')}</div>`
            : '<div class="sub-badges"><span class="mini-badge">healthy</span></div>';

          tr.innerHTML = `
            <td>${row.id ?? ''}</td>
            <td>${row.unit_id ?? ''}</td>
            <td>${row.run_id ?? ''}</td>
            <td>${row.received_at ?? ''}</td>
            <td><span class="badge ${statusInfo.className}">${statusInfo.text}</span></td>
            <td>${healthMarkup}</td>
            <td>${Number(row.latitude ?? 0).toFixed(4)}</td>
            <td>${Number(row.longitude ?? 0).toFixed(4)}</td>
            <td>${Number(row.fuel_remaining ?? 0).toFixed(2)}</td>
            <td>${Number(row.equipment_temperature_c ?? 0).toFixed(2)}</td>
            <td>${Number(row.connectivity_quality ?? 0).toFixed(2)}</td>
          `;

          rowsEl.appendChild(tr);
        }
      }

      document.getElementById('startRunBtn').addEventListener('click', startRun);
      document.getElementById('pauseRunBtn').addEventListener('click', pauseRun);
      document.getElementById('stopRunBtn').addEventListener('click', stopRun);
      document.getElementById('continueRunBtn').addEventListener('click', continueRun);
      document.getElementById('compareRunsBtn').addEventListener('click', compareRuns);

      loadBtn.addEventListener('click', fetchUnits);
      runIdEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          fetchUnits();
        }
      });
      unitIdEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          fetchUnits();
        }
      });

      unitIdEl.addEventListener('input', () => {
        if (!unitIdEl.value.trim()) {
          selectedUnitId = null;
          fetchUnits();
        }
      });

      selectedRunId = null;
      selectedUnitId = null;
      runIdEl.value = '';
      unitIdEl.value = '';
      stopPolling();
      mapEmptyEl.textContent = 'Waiting for a run selection.';
      mapEmptyEl.style.display = 'flex';
      window.addEventListener('beforeunload', () => {
        stopPolling();
      });
    </script>
  </body>
</html>
